server {
    listen 80;
    server_name cajas.bioimplantsrl.com.ar;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name cajas.bioimplantsrl.com.ar;

    # Certbot / Let's Encrypt - ajustar rutas
    ssl_certificate /etc/letsencrypt/live/cajas.bioimplantsrl.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cajas.bioimplantsrl.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/html/sistemaCajas2026/sistema-cajas-2026/public;
    index index.php;

    # Assets y storage - servir directo
    location /build/ { try_files $uri $uri/ =404; }
    location /storage/ { try_files $uri $uri/ =404; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~ \.php$ { return 404; }

    # Si en el futuro se usa php-fpm en lugar de artisan serve, reemplazar proxy por:
    # location / { try_files $uri $uri/ /index.php?$query_string; }
    # location ~ \.php$ { fastcgi_pass unix:/run/php/php8.2-fpm.sock; ... }
}
