<VirtualHost *:80>
    ServerName cajas.bioimplantsrl.com.ar
    ServerAlias www.cajas.bioimplantsrl.com.ar
    Redirect permanent / https://cajas.bioimplantsrl.com.ar/
</VirtualHost>

<VirtualHost *:443>
    ServerName cajas.bioimplantsrl.com.ar
    ServerAlias www.cajas.bioimplantsrl.com.ar


    DocumentRoot /var/www/html/sistemaCajas2026/sistema-cajas-2026/public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/cajas.bioimplantsrl.com.ar/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cajas.bioimplantsrl.com.ar/privkey.pem
    # Si aún no tenés cert, comentá las 3 líneas de SSL y usá http temporalmente

    <Directory /var/www/html/sistemaCajas2026/sistema-cajas-2026/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/cajas.bioimplantsrl.com.ar_error.log
    CustomLog ${APACHE_LOG_DIR}/cajas.bioimplantsrl.com.ar_access.log combined

    # Proxy a artisan serve 8000 (HTTP interno)
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}e"

    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # No proxear assets si querés servirlos directo por Apache (opcional):
    # ProxyPass /build/ !
    # Alias /build/ /var/www/html/sistemaCajas2026/sistema-cajas-2026/public/build/
    # <Directory /var/www/html/sistemaCajas2026/sistema-cajas-2026/public/build> Require all granted </Directory>
</VirtualHost>
