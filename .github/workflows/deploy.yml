name: CI/CD Pipeline - Sistema Cajas

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. ETAPA DE INTEGRACIÓN CONTINUA (CI)
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer Dependencies
      run: composer install --q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    # Si tienes pruebas automatizadas escritas, descomenta la siguiente línea:
    # - name: Execute tests (Unit and Feature tests)
    #   run: php artisan test

  # 2. ETAPA DE DESPLIEGUE CONTINUO (CD)
  deploy:
    runs-on: ubuntu-latest
    needs: laravel-tests # Solo se ejecuta si la etapa de CI (tests) pasa con éxito

    steps:
    - name: Deploying to Ubuntu Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          cd /var/www/html/sistemaCajas2026/sistema-cajas-2026/
          
          # Activar modo mantenimiento (opcional, para evitar errores a usuarios en vivo)
          php artisan down || true
          
          # Traer los cambios de GitHub
          git pull origin main
          
          # Instalar dependencias de PHP actualizadas
          composer install --no-dev --optimize-autoloader --no-interaction
          
          # Instalar dependencias de JS y compilar con Node 24 (Vite)
          npm install
          npm run build
          
          # Correr migraciones de base de datos por si agregaste tablas nuevas
          php artisan migrate --force
          
          # Limpiar cachés para asegurar estabilidad
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          
          # Desactivar modo mantenimiento
          php artisan up