name: Auto Deploy

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          cd /var/www/html/sistemaCajas2026/sistema-cajas-2026/

          # Detener servidor Laravel (tmux)
          tmux send-keys -t laravel C-c
          sleep 2

          # Traer cambios
          git pull origin master
          composer install --no-dev --optimize-autoloader --no-interaction
          npm install
          npm run build
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          # Reiniciar servidor Laravel (tmux)
          tmux send-keys -t laravel "php artisan serve --host=0.0.0.0 --port=8000" Enter
