name: Auto Deploy

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          cd /var/www/html/sistemaCajas2026/sistema-cajas-2026/

          # Detener servidor Laravel (tmux)
          tmux send-keys -t laravel C-c
          sleep 2

          # Traer cambios
          git pull origin master

          # Crear .env solo si no existe; no pisar APP_KEY existente
          if [ ! -f .env ]; then cp .env.example .env; fi
          # APP_URL https sin :8000 — nginx termina SSL en 443 y proxea a artisan en 8000
          sed -i "s|APP_URL=.*|APP_URL=https://cajas.bioimplantsrl.com.ar|" .env
          if ! grep -q "^ASSET_URL=" .env; then echo "ASSET_URL=https://cajas.bioimplantsrl.com.ar" >> .env; else sed -i "s|ASSET_URL=.*|ASSET_URL=https://cajas.bioimplantsrl.com.ar|" .env; fi
          sed -i "s|APP_ENV=.*|APP_ENV=production|" .env
          sed -i "s|APP_DEBUG=.*|APP_DEBUG=false|" .env
          sed -i "s|^DB_CONNECTION=.*|DB_CONNECTION=mysql|" .env
          sed -i "s|^# DB_HOST=.*|DB_HOST=127.0.0.1|" .env
          sed -i "s|^# DB_PORT=.*|DB_PORT=3306|" .env
          sed -i "s|^# DB_DATABASE=.*|DB_DATABASE=sistemas_caja|" .env
          sed -i "s|^# DB_USERNAME=.*|DB_USERNAME=userCajas|" .env
          sed -i "s|^# DB_PASSWORD=.*|DB_PASSWORD=MO-b0g/YEWPVTD(3|" .env
          sed -i "s|API_PROCEDURE_TOKEN=.*|API_PROCEDURE_TOKEN=ruzEahuW4ysZgL1HJLXpkffDEgperHmeK1UwtwHpp3fYPWW7n6m9cysP5BPJwB8VZC7Ad82t6xjHuaU8|" .env

          composer install --no-dev --optimize-autoloader --no-interaction
          npm install
          npm run build
          # Generar APP_KEY solo si está vacío (no regenerar en cada deploy para no invalidar sesiones)
          grep -q "^APP_KEY=$" .env && php artisan key:generate --force || true
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          # Reiniciar servidor Laravel (tmux) + asegurar nginx proxy https 443 -> 8000
          if [ -f docs/nginx/cajas.bioimplantsrl.com.ar.conf ]; then sudo cp docs/nginx/cajas.bioimplantsrl.com.ar.conf /etc/nginx/sites-available/cajas.bioimplantsrl.com.ar.conf; sudo ln -sf /etc/nginx/sites-available/cajas.bioimplantsrl.com.ar.conf /etc/nginx/sites-enabled/cajas.bioimplantsrl.com.ar.conf; sudo nginx -t && sudo systemctl reload nginx || true; fi
          tmux send-keys -t laravel "php artisan serve --host=0.0.0.0 --port=8000" Enter
